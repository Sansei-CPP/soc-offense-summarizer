# Conda environment for the SOC offense summarizer.
#   conda env create -f environment.yml
#   conda activate soc-summarizer
name: soc-summarizer
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pip
  - pip:
      - ollama>=0.4.0
      - pydantic>=2.5
      - pytest>=7.4
